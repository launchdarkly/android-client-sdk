// local.properties is not checked in, so it is where machine-specific settings such as the mobile
// key belong. See test-app/README.md for the keys this app reads.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace "com.launchdarkly.sdk.testapp"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.launchdarkly.sdk.testapp"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        buildConfigField("String", "MOBILE_KEY",
                "\"${localProperties.getProperty('launchdarkly.mobileKey', '')}\"")
        buildConfigField("String", "LD_ENVIRONMENT",
                "\"${localProperties.getProperty('launchdarkly.environment', 'production')}\"")
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")
        }
    }
}

dependencies {
